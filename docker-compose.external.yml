services:
  grocy:
    image: lscr.io/linuxserver/grocy
    container_name: grocy
    hostname: grocy
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - TZ=${TIMEZONE:-Etc/UTC}
      - GROCY_BASE_URL=${GROCY_BASE_URL}
    volumes:
      - ${GROCY_CONFIG_FOLDER:-./config}:/config
    restart: unless-stopped
    networks:
      external:
        ipv4_address: ${GROCY_IP}

networks:
  external:
    external: true
    name: ${EXTERNAL_NETWORK_NAME}
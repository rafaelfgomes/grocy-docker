services:
  grocy:
    image: lscr.io/linuxserver/grocy
    container_name: grocy
    hostname: grocy
    environment:
      - PUID=${PUID}
      - PGID=$PUID}
      - TZ=${TIMEZONE}
    volumes:
      - ${GROCY_CONFIG_FOLDER}:/config
    restart: unless-stopped
    networks:
      net:

networks:
  net: {}